[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "floodguard"
dynamic = ["version"]
description = "ML flood early-warning platform for Pulau Pinang, Malaysia."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Private :: Do Not Upload",
]
# Core: needed for Phase 1-2 data discovery, validation, and tabular processing.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
    # IANA zone data for zoneinfo (Windows ships none); already installed via pandas.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Phase 5-6 classical ML. Heavier/later stacks are added when their phase starts.
ml = [
    "scikit-learn>=1.5",
    # Phase 5 task "XGBoost/LightGBM": one representative gradient-boosting
    # family (XGBoost, CPU default). LightGBM intentionally not added.
    "xgboost>=2.0,<4",
]
# Phase 8 backend: FastAPI + SQLAlchemy/Alembic + PostGIS types + PG driver.
# Unit tests run on SQLite and PG-dialect compile checks; no live server needed.
backend = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "geoalchemy2>=0.15",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "uvicorn>=0.30",
]
# Phase 9 dashboard: Streamlit internal analytics UI (tests cover pure
# view-models/client; the app itself needs no live server for unit tests).
# httpx is the dashboard HTTP transport (shared with the backend extra).
dashboard = [
    "streamlit>=1.38",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.version]
path = "src/floodguard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/floodguard"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Python only: keep the formatter away from Markdown docs and agent instructions.
include = ["*.py", "*.pyi", "pyproject.toml"]
# Third-party Claude skill scripts are vendored as-is; not project code.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "PT", "DTZ"]

# FastAPI declares dependencies/defaults via Depends()/Query() calls in
# signatures; B008 is a false positive for that idiom (confined to api.py).
[tool.ruff.lint.per-file-ignores]
"src/floodguard/backend/api.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
markers = [
    "integration: requires external services (database, network)",
    "slow: long-running; excluded from the default fast suite when selected with -m",
]

[tool.coverage.run]
source = ["floodguard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
